name: CI

on:
  push:
    branches: [main]
    # Tags are built too, so a released commit is known to compile and pass its
    # assertions on a clean machine. No signing happens here -- see RELEASING.md.
    tags: ["v*"]
  pull_request:

jobs:
  build:
    # Pinned rather than macos-latest, so a runner image rolling forward cannot break a
    # build on its own schedule. macOS 26 is the first image whose SDK produces the
    # Liquid Glass appearance, so this is the image that matches what releases ship.
    #
    # Nothing in Sources/ needs it to compile -- the code deliberately calls no
    # macOS 26-only API, so it still builds on macos-15 and on a contributor's older
    # Mac. See the toolbar comment in ContentView.swift.
    runs-on: macos-26
    steps:
      # v4 runs on Node 20, which GitHub now forces onto Node 24 with a deprecation
      # warning. v5 through v7 all declare node24; v7 is current and changes nothing we
      # use -- its one behaviour change blocks checking out fork PRs under
      # pull_request_target and workflow_run, and this workflow uses neither.
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: swift --version

      - name: Build
        run: swift build -c release

      # The self-check covers the pure logic: resource selection, filenames and
      # collisions, date grouping, the incremental index, timestamps and Finder tags.
      # It exits non-zero on the first failed assertion. It never touches PhotoKit,
      # so it runs fine without a photo library or a signed-in iCloud account.
      - name: Self-check
        run: .build/release/iCloudGUI --self-check

      - name: Assemble app bundle
        run: ./build.sh release

      # build.sh stamps the real SDK version into the binary because SwiftPM stamps
      # the deployment target instead. Assert the flag actually took effect, by
      # comparing what the binary records against the SDK that is installed -- a
      # mismatch means the stamp silently stopped working.
      - name: Check the binary records the real SDK version
        run: |
          sdk=$(otool -l "build/iCloud GUI.app/Contents/MacOS/iCloudGUI" \
                | awk '/LC_BUILD_VERSION/{f=1} f&&/^ *sdk /{print $2; exit}')
          installed=$(xcrun --sdk macosx --show-sdk-version)
          echo "recorded: $sdk   installed SDK: $installed"
          [ "$sdk" = "$installed" ] || {
            echo "::error::binary records SDK $sdk but $installed is installed"; exit 1; }

      # The runner has Xcode, so actool is present and the layered icon must have been
      # compiled. build.sh skips it silently by design on a machine without Xcode, which
      # is exactly why CI has to be the thing that notices it going missing.
      - name: Check the layered icon was compiled in
        run: |
          test -f "build/iCloud GUI.app/Contents/Resources/Assets.car" || {
            echo "::error::Assets.car missing -- the macOS 26 icon was not compiled"; exit 1; }
          plutil -p "build/iCloud GUI.app/Contents/Info.plist" | grep -q CFBundleIconName || {
            echo "::error::CFBundleIconName missing -- Assets.car would be ignored"; exit 1; }
          echo "layered icon present"
