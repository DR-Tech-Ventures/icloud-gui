name: CI

on:
  push:
    branches: [main]
    # Tags are built too, so a released commit is known to compile and pass its
    # assertions on a clean machine. No signing happens here -- see RELEASING.md.
    tags: ["v*"]
  pull_request:

# The repository's default workflow token is already read-only, but that is a setting in
# the web UI: flipping it to read-and-write silently widens every workflow in the repo
# at once. Stating it here pins it to the file, where a change shows up in a diff.
# This workflow compiles and asserts; it writes nothing back to GitHub.
permissions:
  contents: read

jobs:
  build:
    # Pinned rather than macos-latest, so a runner image rolling forward cannot break a
    # build on its own schedule.
    #
    # xcode-27 rather than macos-26: macos-26 carries Xcode 26.6, so it builds against
    # the macOS 26 SDK, while releases are built on a Mac with Xcode 27 against the 27
    # SDK. CI validating a different SDK from the one that ships is the gap this closes,
    # and the SDK-stamp check below could never have caught it -- that step compares the
    # binary against whatever SDK the machine running it happens to have, so it passed
    # on both machines while the two disagreed with each other.
    #
    # Since the deployment target moved to macOS 27 this is also the only image that can
    # compile Sources/ at all: PHAssetResource.filename and .dataSize are not in the 26
    # SDK, so macos-26 would now fail outright rather than quietly differ.
    #
    # Worth knowing: actions/runner-images marks xcode-27 a public preview, so some
    # software on it can be unstable and capacity may queue. That is the accepted cost of
    # having CI test what releases actually ship.
    runs-on: xcode-27
    steps:
      # v4 runs on Node 20, which GitHub now forces onto Node 24 with a deprecation
      # warning. v5 through v7 all declare node24; v7 is current and changes nothing we
      # use -- its one behaviour change blocks checking out fork PRs under
      # pull_request_target and workflow_run, and this workflow uses neither.
      #
      # Pinned to the commit rather than the tag: a tag is mutable, so `@v7` runs
      # whatever that tag points at on the day the workflow runs. Dependabot keeps the
      # SHA and the version comment on that line in step with each other.
      #
      # persist-credentials: false because nothing after this step uses git -- the
      # default leaves the token in .git/config for the rest of the job, readable by
      # anything the build runs. There is nothing third-party in this job to read it
      # today, which is the cheapest moment to stop leaving it lying there.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show toolchain
        run: swift --version

      - name: Build
        run: swift build -c release

      # The self-check covers the pure logic: resource selection, filenames and
      # collisions, date grouping, the incremental index, timestamps and Finder tags.
      # It exits non-zero on the first failed assertion. It never touches PhotoKit,
      # so it runs fine without a photo library or a signed-in iCloud account.
      - name: Self-check
        run: .build/release/iCloudGUI --self-check

      - name: Assemble app bundle
        run: ./build.sh release

      # build.sh stamps the real SDK version into the binary because SwiftPM stamps
      # the deployment target instead. Assert the flag actually took effect, by
      # comparing what the binary records against the SDK that is installed -- a
      # mismatch means the stamp silently stopped working.
      - name: Check the binary records the real SDK version
        run: |
          sdk=$(otool -l "build/iCloud GUI.app/Contents/MacOS/iCloudGUI" \
                | awk '/LC_BUILD_VERSION/{f=1} f&&/^ *sdk /{print $2; exit}')
          installed=$(xcrun --sdk macosx --show-sdk-version)
          echo "recorded: $sdk   installed SDK: $installed"
          [ "$sdk" = "$installed" ] || {
            echo "::error::binary records SDK $sdk but $installed is installed"; exit 1; }

      # The runner has Xcode, so actool is present and the layered icon must have been
      # compiled. build.sh skips it silently by design on a machine without Xcode, which
      # is exactly why CI has to be the thing that notices it going missing.
      - name: Check the layered icon was compiled in
        run: |
          test -f "build/iCloud GUI.app/Contents/Resources/Assets.car" || {
            echo "::error::Assets.car missing -- the layered icon was not compiled"; exit 1; }
          plutil -p "build/iCloud GUI.app/Contents/Info.plist" | grep -q CFBundleIconName || {
            echo "::error::CFBundleIconName missing -- Assets.car would be ignored"; exit 1; }
          echo "layered icon present"
